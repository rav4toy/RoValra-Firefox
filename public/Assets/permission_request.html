<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>RoValra permission request</title>
        <style>
            :root {
                color-scheme: dark;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            }
            body {
                min-height: 100vh;
                margin: 0;
                display: grid;
                place-items: center;
                background: #111827;
                color: #f9fafb;
            }
            main {
                box-sizing: border-box;
                width: min(400px, calc(100% - 32px));
                padding: 28px;
                border: 1px solid #374151;
                border-radius: 14px;
                background: #1f2937;
                box-shadow: 0 18px 45px rgb(0 0 0 / 35%);
            }
            h1 {
                margin: 0 0 10px;
                font-size: 1.45rem;
            }
            p {
                color: #d1d5db;
                line-height: 1.45;
            }
            #permission-list {
                margin: 18px 0;
                padding: 12px 16px 12px 34px;
                border-radius: 9px;
                background: #111827;
                font-weight: 650;
            }
            .actions {
                display: flex;
                justify-content: flex-end;
                gap: 10px;
                margin-top: 22px;
            }
            button {
                padding: 9px 16px;
                border: 1px solid #4b5563;
                border-radius: 8px;
                background: #374151;
                color: inherit;
                font: inherit;
                cursor: pointer;
            }
            #grant {
                border-color: #2563eb;
                background: #2563eb;
            }
            button:focus-visible {
                outline: 3px solid #93c5fd;
                outline-offset: 2px;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Additional permission</h1>
            <p>
                The feature you enabled needs the following Firefox
                permission. RoValra will only ask after you select Grant.
            </p>
            <ul id="permission-list"></ul>
            <div class="actions">
                <button id="cancel" type="button">Cancel</button>
                <button id="grant" type="button">Grant</button>
            </div>
        </main>
        <script src="permission_request.js"></script>
    </body>
</html>
